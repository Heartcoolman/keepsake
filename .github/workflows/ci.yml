# Public-visitor CI. Deliberately does NOT check out the private `core` submodule
# and never runs scripts/select-core.sh: this is exactly what an outside clone
# gets, so a public stub that no longer satisfies the public sources or tests
# fails here instead of silently working only on a maintainer's machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: typecheck + server tests + client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fail if private core leaked into the public tree
        run: ./scripts/check-leaks.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # MOCK_AI keeps the suite offline; INFERENCE_DISABLED skips ONNX model downloads.
      - run: pnpm test
        env:
          MOCK_AI: '1'
          INFERENCE_DISABLED: '1'

      - run: pnpm -r build

  android:
    name: android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: android
